plugins {
    id "idea"
    id "com.android.library" apply false
    id "com.google.devtools.ksp" version "2.3.6" apply false
    id "io.gitlab.arturbosch.detekt" version "1.23.6" apply false
}

idea.module {
    excludeDirs += file("out")
}

def getGitCommitCount() {
    try {
        // Pass null (not []) so the subprocess inherits the parent process environment (including PATH).
        // Passing an empty list strips env vars and prevents git from being found in non-standard PATH setups.
        return Integer.parseInt("git rev-list --count HEAD".execute((List) null, project.rootDir).text.trim())
    } catch (Exception ignored) {
        return 0
    }
}

// ---------------------------------------------------------------------------------------------
// shiroikuma-shizuku fork versioning.
//
// Upstream derives its versionCode from `git rev-list --count HEAD` and its versionName from that
// same count ("Shizuku+ 13.6.0.r2178"). We cannot reuse that directly: on `custom` the count
// includes OUR commits, so every fork commit would silently inflate the version and the number
// would no longer mean "the upstream release we are based on".
//
// Instead the upstream numbers are PINNED in gradle.properties and refreshed by the
// `upstream-new-version` skill on each sync:
//   UPSTREAM_VERSION_CODE  — upstream's versionCode (its commit count) at our base, e.g. 2178
//   UPSTREAM_VERSION_NAME  — upstream's version without the brand prefix, e.g. 13.6.0.r2178
//   BUILD_NUMBER           — OUR increment, bumped by every buildApk, reset to 1 on each sync
//
// Fork versionName = "<UPSTREAM_VERSION_NAME><upstream pin>+<BUILD_NUMBER, 3 digits>"
//                                                     e.g. 13.6.0.r2195.2026-07-30.gac2ae085+008
// Fork versionCode = UPSTREAM_VERSION_CODE * 10000 + BUILD_NUMBER    e.g. 21950008
//
// Ceiling check: versionCode must stay under Android's hard limit of 2100000000, so
// UPSTREAM_VERSION_CODE must stay under 210000. It is ~2195 (one per upstream commit), so there is
// room for roughly a century of upstream development.
// ---------------------------------------------------------------------------------------------
def upstreamVersionCode = Integer.parseInt(project.property("UPSTREAM_VERSION_CODE").toString())
def upstreamVersionName = project.property("UPSTREAM_VERSION_NAME").toString()
def shiroikumaBuild = Integer.parseInt(project.property("BUILD_NUMBER").toString())

// Pass null (not []) so the subprocess inherits PATH — same reason as getGitCommitCount above.
def gitOutput = { String... command ->
    try {
        return command.toList().execute((List) null, project.rootDir).text.trim()
    } catch (Exception e) {
        logger.warn("git command ${command.join(' ')} failed: ${e}")
        return ""
    }
}

// ---- Upstream-base pin (the global `git-versioning` skill) ----------------------------------
// `custom` is rebased onto upstream's branch TIP, not onto a release tag, so the fork's base is an
// arbitrary upstream commit. UPSTREAM_VERSION_NAME does carry upstream's own commit count, but it
// is a value PINNED BY HAND in gradle.properties — if a sync ever forgets to refresh it, the
// version silently lies about which upstream code is in the build. The merge-base is read from git
// and cannot.
//
// merge-base, not HEAD (that identifies OUR commit, which +N already covers) and not master's tip
// (which overstates the base whenever master is fast-forwarded before custom is rebased). It
// therefore moves only on an upstream sync — two builds sharing a pin are built on the same
// upstream code, which is the whole signal.
def upstreamBaseSha = gitOutput("git", "merge-base", "HEAD", "master").take(8)

// The base commit's own committer timestamp, never build time: a bare sha is random text, so it
// orders builds arbitrarily; a bare DATE ties whenever two syncs land on one day and hands the
// ordering straight back to that random sha (白い熊, 2026-08-12); and build time would differ
// between two builds on one base and destroy the "the pin moves only on a sync" property.
//
// In UTC — format the raw epoch, never `--date=format:` (the commit's own offset, used here until
// 2026-08-12) or `--date=format-local:` (the build host's). Kakutoku's linked-version watcher reads
// the same commit back from GitHub, which normalises committer dates to Z.
def upstreamBaseStamp = ""
if (upstreamBaseSha.length() == 8) {
    def upstreamBaseEpoch = gitOutput("git", "show", "-s", "--format=%ct", upstreamBaseSha)
    if (upstreamBaseEpoch ==~ /\d+/) {
        upstreamBaseStamp = java.time.Instant.ofEpochSecond(Long.parseLong(upstreamBaseEpoch))
            .atZone(java.time.ZoneOffset.UTC)
            .format(java.time.format.DateTimeFormatter.ofPattern("yyyy-MM-dd.HH-mm"))
    }
}

// `+` opens each top-level group — upstream's version, the pin, our counter — while the pin's own
// date, time and sha stay dot-joined, all three describing one commit. Never `~`: git rejects it in
// a refname (no release tag), it sorts above every digit, and dpkg reads it as a pre-release marker.
//
// Degrades rather than fails: no git / no local master -> no pin at all; git but no timestamp ->
// sha only. A shallow clone or a source tarball must still build.
def upstreamPin
if (upstreamBaseSha.length() != 8) {
    upstreamPin = ""
} else if (upstreamBaseStamp.length() == 16) {
    upstreamPin = "+${upstreamBaseStamp}.g${upstreamBaseSha}"
} else {
    upstreamPin = "+g${upstreamBaseSha}"
}

// The build counter is zero-padded to three digits in the version name — the standing family
// convention, already carried by the sister apps (shiroikuma-oyokanri 4.1.0+057,
// shiroikuma-rindenwa …+002). Unpadded, `~/tmp` sorts +10 before +2 and a directory shared by
// every sister app's builds stops reading in build order. The padding is cosmetic to versionCode,
// which stays UPSTREAM_VERSION_CODE * 10000 + BUILD_NUMBER and keeps ordering on its own.
ext {
    versionCode = upstreamVersionCode * 10000 + shiroikumaBuild
    versionName = "${upstreamVersionName}${upstreamPin}+${String.format('%03d', shiroikumaBuild)}"
    forkUpstreamVersionCode = upstreamVersionCode
    forkUpstreamVersionName = upstreamVersionName
    forkUpstreamBaseSha = upstreamBaseSha
    forkUpstreamBaseStamp = upstreamBaseStamp
    forkBuildNumber = shiroikumaBuild
}

logger.lifecycle("shiroikuma-shizuku ${ext.versionName} (versionCode ${ext.versionCode})")

subprojects {
    apply plugin: "io.gitlab.arturbosch.detekt"

    detekt {
        config.setFrom(files("$rootDir/detekt.yml"))
        buildUponDefaultConfig = true
        autoCorrect = true
    }

    dependencies {
        detektPlugins "io.gitlab.arturbosch.detekt:detekt-formatting:1.23.6"
    }

    plugins.withId("com.android.base") {
        android {
            compileSdk = 35
            buildToolsVersion = "35.0.0"
            defaultConfig {
                minSdk = 24
                targetSdk = 35
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
        }
    }
}
