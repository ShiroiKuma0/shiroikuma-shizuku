org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.configureondemand=true
android.useAndroidX=true
android.nonTransitiveRClass=false

# Sentry crash reporting is DISABLED in this fork. Upstream ships its own DSN here, which would
# send every crash and breadcrumb from 白い熊's device to the upstream author's Sentry account.
# An empty DSN makes the Sentry SDK a no-op (SentryInitializer skips init on a blank DSN).
# Never restore upstream's DSN while resolving a rebase conflict.
SENTRY_DSN=
android.newDsl=false

# === shiroikuma-shizuku fork identity + versioning (see build.gradle + the build-apk skill) ===
# UPSTREAM_VERSION_CODE / UPSTREAM_VERSION_NAME pin the upstream release we are based on; the
# `upstream-new-version` skill refreshes them on each sync. BUILD_NUMBER is OUR increment: bumped
# by every `buildApk`, reset to 1 on each new upstream version.
#   versionName = "<UPSTREAM_VERSION_NAME>+<BUILD_NUMBER>"          e.g. 13.6.0.r2178+1
#   versionCode = UPSTREAM_VERSION_CODE * 10000 + BUILD_NUMBER      e.g. 21780001
UPSTREAM_VERSION_CODE=2284
UPSTREAM_VERSION_NAME=13.6.0.r2284
BUILD_NUMBER=3

# Installed app id. Coexists with STOCK Shizuku (moe.shizuku.privileged.api); NOT with upstream's
# Shizuku+, since we keep upstream's af.shizuku.plus.permission.* names and two apps cannot declare
# the same custom permission (白い熊, 2026-07-29 — see CLAUDE.md).
# The code namespace (af.shizuku.manager) stays upstream's — never rename it.
APP_ID=shiroikuma.shizuku
