plugins {
    id "com.android.library"
    id "dev.rikka.tools.refine"
}

android {
    namespace = "rikka.shizuku.starter"
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        // Same single source of truth as :shell and :manager — gradle.properties APP_ID. Only the
        // fallback for a command line built without --manager=; the real value is threaded in from
        // the server. A literal here would be upstream's id, i.e. wrong for this fork.
        buildConfigField "String", "MANAGER_APPLICATION_ID",
            "\"${providers.gradleProperty("APP_ID").get()}\""
    }


}

dependencies {
    implementation project(":common")
    implementation project(":shared")
    implementation project(":server-shared")
    compileOnly project(":provider")
    implementation "androidx.annotation:annotation:1.3.0"
    implementation libs.hidden.compat
    compileOnly libs.hidden.stub
    implementation libs.refine.runtime
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.android
}
