// Fork: upstream's `sentry { … }` configuration block is REMOVED along with the plugin. It
// pointed at the upstream author's Sentry org (af-developments/shizukuplus) and, whenever a
// SENTRY_AUTH_TOKEN was present, uploaded this build's ProGuard mapping and native debug
// symbols there. This fork sends nothing anywhere. See CLAUDE.md, "No phone-home".

// ---------------------------------------------------------------------------------------------
// shiroikuma-shizuku: the one command that produces a shippable build.
//
//   ./gradlew buildApk
//
// Assembles the signed shizukuplus release, copies it to ~/tmp under the house filename, and
// bumps BUILD_NUMBER in gradle.properties so the next build is a fresh +N (never overwrite an
// older APK — that is a standing rule).
// ---------------------------------------------------------------------------------------------
tasks.register("buildApk") {
    description = "Build the release APK, copy it to ~/tmp, and bump BUILD_NUMBER for next time."
    group = "build"
    dependsOn("assembleShizukuplusRelease")

    def fvName = rootProject.ext.versionName
    def fvCode = rootProject.ext.versionCode
    def currentBuildNumber = rootProject.ext.forkBuildNumber
    def releaseApkDir = layout.buildDirectory.dir("outputs/apk/shizukuplus/release")
    def userHome = providers.systemProperty("user.home")
    def propsFile = rootProject.file("gradle.properties")

    doLast {
        def apkName = "shiroikuma-shizuku_${fvName}_arm64-v8a.apk"
        def outputDir = releaseApkDir.get().asFile
        def targetDir = new File(userHome.get(), "tmp")
        targetDir.mkdirs()

        def apk = outputDir.listFiles({ _, name -> name.endsWith(".apk") } as FilenameFilter)?.find()
        if (apk == null) {
            throw new GradleException("No APK found in ${outputDir}")
        }

        def targetFile = new File(targetDir, apkName)
        java.nio.file.Files.copy(apk.toPath(), targetFile.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        println("[1;36m>>> ${targetFile.absolutePath}[0m")
        println("[1;36m>>> versionCode ${fvCode}[0m")

        // Auto-increment BUILD_NUMBER for the next build.
        def nextBuildNumber = currentBuildNumber + 1
        propsFile.text = propsFile.text.replace(
            "BUILD_NUMBER=${currentBuildNumber}\n",
            "BUILD_NUMBER=${nextBuildNumber}\n")
        println("[1;36m>>> BUILD_NUMBER bumped to ${nextBuildNumber}[0m")
    }
}

