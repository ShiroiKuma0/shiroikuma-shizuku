android {
    // Code namespace stays upstream's — only the installed applicationId differs, so rebases
    // never turn into a mass-rename conflict.
    namespace = "af.shizuku.manager"
    defaultConfig {
        applicationId = providers.gradleProperty("APP_ID").get()
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
        // Fork: 白い熊's phone is arm64. Upstream builds a universal APK carrying all four ABIs;
        // we package arm64-v8a only, which matches the APK filename convention and roughly halves
        // the download.
        ndk {
            abiFilters "arm64-v8a"
        }
        // Fork: HARDWIRED EMPTY, not read from a property. An empty DSN makes
        // ShizukuApplication.initializeSentryEarly() return before SentryAndroid.init(), so the
        // SDK is never armed and has no transport — every Sentry.captureException /
        // addBreadcrumb call site across the app becomes a no-op that performs no I/O.
        // This fork sends nothing anywhere. See CLAUDE.md, "No phone-home".
        buildConfigField "String", "SENTRY_DSN", "\"\""
        manifestPlaceholders = [sentryDsn: '']
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        multiDexKeepProguard file("multidex-keep.pro")
        externalNativeBuild {
            cmake {
                // SHIROIKUMA_PACKAGE_NAME hands our applicationId to the native starter, which
                // resolves the manager APK with `pm path <package>` when it is invoked without
                // --apk= (the manual `adb shell .../libshizuku.so` command). Upstream hardcoded
                // its own ids there, so the manual start failed with "can't get path of manager"
                // on this fork. Derived, not spelled — see starter.cpp and CLAUDE.md.
                arguments = [
                    "-DANDROID_STL=none",
                    "-DANDROID_LD=lld",
                    "-Wl,-z,max-page-size=16384",
                    "-DSHIROIKUMA_PACKAGE_NAME=" + providers.gradleProperty("APP_ID").get()
                ]
            }
        }
    }
    buildFeatures {
        buildConfig = true
        resValues = true
        viewBinding = true
        prefab = true
        aidl = true
        compose = true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "2.2.20"
    }
    signingConfigs {
        sign {}
    }
    flavorDimensions = ["distribution"]
    productFlavors {
        // The flavor we ship. Coexists with stock Shizuku: it does not claim the stock package
        // name or the stock provider authority — stock-API clients reach us through the bundled
        // Compat Hub stub (see the :compat module) instead.
        shizukuplus {
            dimension = "distribution"
            applicationId = providers.gradleProperty("APP_ID").get()
            resValue "string", "app_name", "白い熊 雫"
        }
        dropin {
            dimension = "distribution"
            applicationId = "moe.shizuku.privileged.api"
            resValue "string", "app_name", "Shizuku"
        }
    }
    buildTypes {
        debug {
            signingConfig = signingConfigs.sign
        }
        release {
            signingConfig = signingConfigs.sign
            minifyEnabled = true
            shrinkResources = true
            vcsInfo.include = false
            proguardFiles = ["proguard-rules.pro"]
        }
    }
    externalNativeBuild {
        cmake {
            path = file("src/main/jni/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ["**"]
        }
    }
    dependenciesInfo {
        includeInApk = false
    }
    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
    sourceSets {
        main {
            aidl.srcDirs = ["src/main/aidl"]
        }
    }
}

