def collapseReleaseResourceNames = tasks.register("collapseReleaseResourceNames") {
    def aapt2 = Paths.get(project.android.sdkDirectory.path, "build-tools", project.android.buildToolsVersion, "aapt2")
    def zip = Paths.get(project.buildDir.path, "intermediates",
        "optimized_processed_res", "release", "optimizeReleaseResources", "resources-release-optimize.ap_")
    doLast {
        def optimized = new File("${zip}.opt")
        def execOps = services.get(ExecOperations)
        execOps.exec {
            commandLine aapt2.toFile(), "optimize", "--collapse-resource-names",
                "--resources-config-path", "aapt2-resources.cfg",
                "-o", optimized, zip.toFile()
            ignoreExitValue = false
        }
        if (optimized.exists()) {
            delete(zip.toFile())
            optimized.renameTo(zip.toFile())
        }
    }
}

afterEvaluate {
    def optimizeReleaseResources = tasks.findByName("optimizeReleaseResources")
    if (optimizeReleaseResources != null) {
        optimizeReleaseResources.finalizedBy(collapseReleaseResourceNames)
    }
    
    tasks.register("copyCompatApkRelease", Copy) {
        dependsOn ":compat:assembleRelease"
        // Use fileTree so we match both compat-release.apk (signed) and compat-release-unsigned.apk.
        // The hardcoded filename was the root cause of the compat stub never being bundled on CI (#293).
        from fileTree("${project(':compat').layout.buildDirectory.get().asFile}/outputs/apk/release") {
            include "*.apk"
        }
        into "src/main/assets"
        rename { "compat.apk" }
    }

    tasks.register("copyCompatApkDebug", Copy) {
        dependsOn ":compat:assembleDebug"
        from fileTree("${project(':compat').layout.buildDirectory.get().asFile}/outputs/apk/debug") {
            include "*.apk"
        }
        into "src/main/assets"
        rename { "compat.apk" }
    }
    
    // Wire compat and shell for both the generic pre-build hooks (single-flavor builds)
    // and the flavor-specific hooks produced when product flavors are configured.
    tasks.findByName("preReleaseBuild")?.dependsOn("copyCompatApkRelease")
    tasks.findByName("preReleaseBuild")?.dependsOn(":shell:assembleRelease")

    tasks.findByName("preDebugBuild")?.dependsOn("copyCompatApkDebug")
    tasks.findByName("preDebugBuild")?.dependsOn(":shell:assembleDebug")

    android.productFlavors.each { flavor ->
        def name = flavor.name.capitalize()
        tasks.findByName("pre${name}ReleaseBuild")?.dependsOn("copyCompatApkRelease")
        tasks.findByName("pre${name}ReleaseBuild")?.dependsOn(":shell:assembleRelease")
        tasks.findByName("pre${name}DebugBuild")?.dependsOn("copyCompatApkDebug")
        tasks.findByName("pre${name}DebugBuild")?.dependsOn(":shell:assembleDebug")
    }
}


