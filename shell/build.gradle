plugins {
    id "com.android.application"
    id "dev.rikka.tools.refine"
}

android {
    namespace = "rikka.shizuku.shell"
    defaultConfig {
        versionCode = rootProject.ext.versionCode
        versionName = rootProject.ext.versionName

        // The manager's applicationId, injected from the ONE place that owns it —
        // gradle.properties APP_ID, the same property manager/build.gradle reads. rish and
        // `sh plus` run in a fresh app_process in the calling app's UID, so they cannot ask the
        // server which manager is installed; before this they carried a hand-written literal that
        // every upstream rewrite of ShizukuShellLoader silently reverted to upstream's own id.
        buildConfigField "String", "MANAGER_APPLICATION_ID",
            "\"${providers.gradleProperty("APP_ID").get()}\""
    }
    buildTypes {
        debug {
            multiDexEnabled = false
        }
        release {
            minifyEnabled = true
            proguardFiles = ["proguard-rules.pro"]
        }
    }
    dependenciesInfo {
        includeInApk = false
    }
    lint {
        checkReleaseBuilds = false
    }
    buildFeatures {
        buildConfig = true
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.all {
        def outDir = new File(rootDir, "out")
        def mappingPath = new File(outDir, "mapping").absolutePath
        def dexPath = "${rootProject.rootDir.path}/manager/src/main/assets"
        variant.assembleProvider.get().doLast {
            if (variant.getBuildType().isMinifyEnabled()) {
                copy {
                    from variant.mappingFileProvider.get()
                    into mappingPath
                    rename { String fileName ->
                        mappingPath + File.separator + "cmd-v${variant.versionName}.txt"
                    }
                }
            }
            copy {
                def file = zipTree(file(outputFile)).matching { include "classes*.dex" }.singleFile

                from file
                into dexPath
                rename { String fileName ->
                    fileName.replace(file.getName(), "rish_shizuku.dex")
                }
            }
        }
    }
}

dependencies {
    implementation libs.hidden.compat
    compileOnly libs.hidden.stub
}
